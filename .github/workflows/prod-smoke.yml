name: prod-smoke

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to smoke
        default: https://dash.chmonitor.dev

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Run smoke
        id: smoke
        working-directory: apps/dashboard
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://dash.chmonitor.dev' }}
        run: |
          set +e
          bun scripts/smoke-prod.ts --json "$RUNNER_TEMP/smoke.json" | tee "$RUNNER_TEMP/smoke.txt"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, update, or close the prod-smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.smoke.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create prod-smoke --color B60205 --description 'Scheduled production smoke failure' 2>/dev/null || true
          issue=$(gh issue list --label prod-smoke --state open --json number --jq '.[0].number // empty')
          if [ "$CODE" = "0" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Smoke green again: $RUN_URL"
            fi
            exit 0
          fi
          {
            echo "Production smoke failed (exit $CODE). Run: $RUN_URL"
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --label prod-smoke --title 'prod-smoke: production smoke failing' --body-file "$RUNNER_TEMP/body.md"
          fi
          # A harness error (exit 2) should also turn the run red.
          exit 1
