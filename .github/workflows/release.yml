name: Release

on:
  # Tagging + release creation is owned by release-please (release-please.yml).
  # We fire on the published release it cuts — not on the tag push — to avoid a
  # duplicate run for the same version. workflow_dispatch stays for manual builds.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write
  models: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker-amd64:
    name: build-docker-amd64
    runs-on: ubuntu-latest
    # 30min was exactly the cold-build wall time → timed out for v0.2.7/v0.2.8.
    # With the shared warm cache this is ~1min; the headroom only matters if the
    # cache was evicted, in which case a slow build should still complete.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@85e876bd3a78bcc6b9925c818c482e365cf13b71
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-amd64

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        env:
          TMPDIR: /home/runner/work/_temp
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}
            SKIP_RUST=true
          # Reuse ci.yml's warm AMD64 layer cache. ci.yml builds on every main
          # push via base.yml with tag-suffix '-amd64', producing the scope
          # 'docker--amd64' (the suffix already carries a leading dash). main is
          # the default branch, so its caches are readable from this tag-pinned
          # release dispatch — turning a cold ~30min build (which timed out for
          # v0.2.7/v0.2.8) into a ~1min warm one.
          cache-from: type=gha,scope=docker--amd64
          cache-to: type=gha,scope=docker--amd64,mode=max
          platforms: linux/amd64

  build-docker-arm64:
    name: build-docker-arm64
    needs: [build-docker-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-arm64

      - name: Extract build artifacts from AMD64 image
        run: |
          AMD64_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64"
          echo "Pulling AMD64 image: $AMD64_TAG"
          docker pull "$AMD64_TAG"

          # Extract standalone app from AMD64 image
          CONTAINER=$(docker create "$AMD64_TAG")
          mkdir -p /tmp/cross-build
          docker cp "$CONTAINER:/app/." /tmp/cross-build/
          docker rm "$CONTAINER"

          # Use the shared, checked-in ARM64 wrapper Dockerfile (see
          # Dockerfile.arm64 for why) rather than an inline heredoc copy.
          cp "$GITHUB_WORKSPACE/Dockerfile.arm64" /tmp/cross-build/Dockerfile

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/cross-build
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

  docker-manifest:
    name: docker-manifest
    needs: [build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Extract release metadata
        id: release_meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          if [[ "$VERSION" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@85e876bd3a78bcc6b9925c818c482e365cf13b71
        with:
          # IMAGE_NAME (github.repository) is ghcr.io/chmonitor/chmonitor — the
          # canonical brand. The loop below creates manifests for every generated tag.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release_meta.outputs.version }}
            type=raw,value=${{ steps.release_meta.outputs.minor }},enable=${{ steps.release_meta.outputs.stable == 'true' }}
            type=raw,value=${{ steps.release_meta.outputs.major }},enable=${{ steps.release_meta.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release_meta.outputs.stable == 'true' }}
            type=sha,prefix=sha-

      - name: Create and push multi-arch manifests
        shell: bash
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          AMD64=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64
          ARM64=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64

          TAGS=$(jq -r '.tags[]' <<<"$TAGS_JSON")
          [ -n "$TAGS" ] || { echo "::error::metadata-action produced no tags"; exit 1; }

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Creating manifest: $TAG"
            docker buildx imagetools create -t "$TAG" "$AMD64" "$ARM64"
          done <<<"$TAGS"

  assets:
    name: assets
    needs: docker-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # apps/dashboard has its own lockfile (not a root workspace member); its
      # vite bundling resolves @chm/* deps from the app's own node_modules, so
      # install in isolation inside apps/dashboard, NOT at the repo root.
      - name: Install dependencies
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      # Standalone = the Nitro node-server output (.output). Use the build:node:ci
      # wrapper, NOT a bare vite build: the prerender finishes but the process
      # never exits (nitro's render server leaves a socket open), so a plain
      # `bun run build:node` would hang. The wrapper reaps it once artifacts land.
      - name: Build standalone (Node) output
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GIT_REF: ${{ steps.meta.outputs.tag }}
          VITE_CI: "true"
        working-directory: apps/dashboard
        run: pnpm run build:node:ci

      # Cloudflare = the workerd bundle (dist/) from the default vite build. This
      # target uses @cloudflare/vite-plugin (not nitro) and exits cleanly.
      - name: Build Cloudflare (Workers) output
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GIT_REF: ${{ steps.meta.outputs.tag }}
          VITE_CI: "true"
        working-directory: apps/dashboard
        run: pnpm exec vite build

      - name: Package release archives
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          tar -czf "clickhouse-monitor-${TAG}-standalone.tar.gz" \
            apps/dashboard/.output \
            apps/dashboard/package.json \
            apps/dashboard/pnpm-lock.yaml \
            apps/dashboard/pnpm-workspace.yaml
          tar -czf "clickhouse-monitor-${TAG}-cloudflare.tar.gz" \
            apps/dashboard/dist \
            apps/dashboard/wrangler.toml \
            apps/dashboard/package.json \
            apps/dashboard/pnpm-lock.yaml \
            apps/dashboard/pnpm-workspace.yaml
          shasum -a 256 "clickhouse-monitor-${TAG}-standalone.tar.gz" "clickhouse-monitor-${TAG}-cloudflare.tar.gz" > SHA256SUMS

      # Centralized release notes: tiered AI summary (Copilot → GitHub Models →
      # AnyRouter), recap stats, Docker pull/FROM block, compare link, and the
      # migration prompt — all from duyet/llm-release-action. It also publishes
      # the GitHub Release body; we attach the build archives below.
      - name: Generate & publish release notes
        uses: duyet/llm-release-action@a44950e3aadd5eeb4d239e843cdd37801bbfc8f7 # v1
        with:
          release-tag: ${{ steps.meta.outputs.tag }}
          project-name: chmonitor
          docker-image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          docker-extra-image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/chmonitor
          notes-prompt-file: .github/release-notes-prompt.md
          system-prompt-file: .github/release-notes-system-prompt.md
          migration-prompt-file: .github/release-migration-prompt.md
          anyrouter-source: chmonitor
          anyrouter-title: CHMonitor
          anyrouter-api-key: ${{ secrets.ANYROUTER_API_KEY }}
          anyrouter-model: ${{ vars.ANYROUTER_MODEL || 'openai/gpt-4o-mini' }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ steps.meta.outputs.tag }}
          path: |
            clickhouse-monitor-${{ steps.meta.outputs.tag }}-standalone.tar.gz
            clickhouse-monitor-${{ steps.meta.outputs.tag }}-cloudflare.tar.gz
            SHA256SUMS
            release-notes.md
          if-no-files-found: error

      - name: Attach build archives to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "clickhouse-monitor-${TAG}-standalone.tar.gz" \
            "clickhouse-monitor-${TAG}-cloudflare.tar.gz" \
            SHA256SUMS \
            --clobber

  # Friendly What's new file for the dashboard dialog + landing /changelog.
  # Does not replace the GitHub Release body (already published above).
  whats-new:
    name: whats-new
    needs: [assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      models: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ needs.assets.outputs.tag }}
          path: /tmp/release-assets

      - name: Build What's new prompt
        id: prompt
        env:
          RELEASE_TAG: ${{ needs.assets.outputs.tag }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          bun scripts/build-whats-new-prompt.ts \
            --tag "$RELEASE_TAG" \
            --date "$DATE" \
            --release-notes /tmp/release-assets/release-notes.md \
            --out whats-new-prompt.txt
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Friendly notes (GitHub Copilot)
        id: ai_copilot
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          provider: copilot
          model: openai/gpt-4o
          prompt-file: whats-new-prompt.txt

      - name: Friendly notes (GitHub Models)
        id: ai_models
        if: ${{ steps.ai_copilot.outputs.response == '' }}
        continue-on-error: true
        uses: actions/ai-inference@v3
        with:
          provider: github-models
          model: openai/gpt-4o
          prompt-file: whats-new-prompt.txt

      - name: Write docs/whats-new file
        env:
          RELEASE_TAG: ${{ needs.assets.outputs.tag }}
          COPILOT_FILE: ${{ steps.ai_copilot.outputs.response-file }}
          MODELS_FILE: ${{ steps.ai_models.outputs.response-file }}
          DATE: ${{ steps.prompt.outputs.date }}
        run: |
          set -euo pipefail
          AI=""
          if [ -n "${COPILOT_FILE:-}" ] && [ -s "$COPILOT_FILE" ]; then AI="$COPILOT_FILE"
          elif [ -n "${MODELS_FILE:-}" ] && [ -s "$MODELS_FILE" ]; then AI="$MODELS_FILE"
          fi
          ARGS=(--tag "$RELEASE_TAG" --date "$DATE" --release-notes /tmp/release-assets/release-notes.md)
          if [ -n "$AI" ]; then ARGS+=(--ai-file "$AI"); fi
          bun scripts/write-whats-new.ts "${ARGS[@]}"

      - name: Commit friendly notes to main
        env:
          TAG: ${{ needs.assets.outputs.tag }}
        run: |
          set -euo pipefail
          git add docs/whats-new/*.md
          if git diff --cached --quiet; then
            echo "No What's new changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dashboard): add What's new notes for ${TAG}

          Co-Authored-By: duyetbot <bot@duyet.net>"
          git pull --rebase origin main
          git push origin HEAD:main

