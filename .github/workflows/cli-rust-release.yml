name: CLI Rust Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'chm-v* tag to build and attach binaries to (required when dispatched by release-please, whose GITHUB_TOKEN-created tags cannot fire the push trigger)'
        required: false
        type: string
  push:
    tags:
      # Stable only — exclude beta tags created by main pushes so they do not
      # re-trigger this workflow as a second (stable) build.
      - 'chm-v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
    paths:
      - 'rust/ch-monitor-cli/**'
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - '.github/workflows/cli-rust-release.yml'
      - 'scripts/install.sh'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: chm
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: chm
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: chm
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: chm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On tag push this is the tag itself; on dispatch, check out the
          # requested tag so the built binary matches the release version.
          # On main push this is refs/heads/main (beta prerelease build).
          ref: ${{ inputs.tag || github.ref }}
      - name: Release meta
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/ch-monitor-cli/Cargo.toml | head -n1)"
            if [ -z "$version" ]; then
              echo "failed to read version from rust/ch-monitor-cli/Cargo.toml" >&2
              exit 1
            fi
            case "$version" in
              0.1.*) ;;
              *)
                echo "refusing to ship beta from unexpected Cargo.toml version '$version' (expected 0.1.x)" >&2
                exit 1
                ;;
            esac
            echo "tag=chm-v${version}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            tag="${{ inputs.tag || github.ref_name }}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # ch-monitor-cli is a member of the rust/ Cargo workspace, so it
          # builds into the shared rust/target dir.
          workspaces: rust -> target
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        working-directory: rust/ch-monitor-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          # The crate's [[bin]] is named `chm` (so `cargo install` matches the docs).
          cp rust/target/${{ matrix.target }}/release/chm dist/${{ matrix.bin }}-${{ matrix.target }}
          cd dist
          shasum -a 256 ${{ matrix.bin }}-${{ matrix.target }} > ${{ matrix.bin }}-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v3
        if: >-
          github.ref_type == 'tag' ||
          inputs.tag != '' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: dist/*
          generate_release_notes: true
