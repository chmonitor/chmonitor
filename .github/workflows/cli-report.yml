name: CLI report

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'scripts/cli-build-report.sh'
      - '.github/workflows/cli-report.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'scripts/cli-build-report.sh'
      - '.github/workflows/cli-report.yml'
  workflow_dispatch:

concurrency:
  group: cli-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          prefix-key: cli-report
          key: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI only and measure
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: bash scripts/cli-build-report.sh --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-metrics-${{ matrix.target }}
          path: cli-report-metrics/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7

  report:
    name: cli-report
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-metrics-*
          path: cli-report-metrics
          merge-multiple: true
      - name: Assemble markdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cli-build-report.sh --assemble cli-report-metrics --report cli-report.md
      - name: Keep a single sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cli-build-report
          recreate: true
          path: cli-report.md
