name: Blog

# Builds the standalone Astro blog app (apps/blog). It is intentionally outside
# the root bun workspace (like apps/landing and apps/docs), so it installs and
# builds on its own rather than via turbo. Posts live in apps/blog/src/content/blog.

on:
  pull_request:
    paths:
      - 'apps/blog/**'
      - '.github/workflows/blog.yml'
  push:
    branches: [main]
    paths:
      - 'apps/blog/**'
      - '.github/workflows/blog.yml'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/blog/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Generate OG images
        run: pnpm run build:og

      - name: Build
        run: pnpm run build

      - name: Preview smoke
        run: |
          set -euo pipefail
          SERVER_PID=""
          trap '[ -n "$SERVER_PID" ] && kill "$SERVER_PID" 2>/dev/null' EXIT
          pnpm run preview -- --host 127.0.0.1 --port 4322 &
          SERVER_PID=$!
          npx --yes wait-on http://127.0.0.1:4322 --timeout 30000
          curl -fsS http://127.0.0.1:4322/ >/dev/null
          curl -fsS http://127.0.0.1:4322/sitemap.xml | grep -q '<urlset'
          curl -fsS http://127.0.0.1:4322/llms.txt | grep -q 'chmonitor blog'
          echo "preview smoke ok"
