name: Rust CI

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/cli-rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/cli-rust-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        # All 5 workspace members live under rust/, so run workspace-wide
        # checks from the workspace root to lint/test every crate (not just
        # ch-monitor-cli, which was the only one previously covered).
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Workspace members build into the shared rust/target dir.
          workspaces: rust -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --workspace
      - run: cargo test --workspace
      - name: crates.io metadata dry-run (ch-monitor-cli)
        # The CLI crate (`chmonitor`) is the only workspace member published
        # to crates.io from main (see cli-rust-release.yml / cargo-publish.yml).
        # Gate its metadata validity ahead of any release.
        run: cargo publish --dry-run --allow-dirty -p chmonitor
