apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chmonitor.fullname" . }}
  labels:
    {{- include "chmonitor.labels" . | nindent 4 }}
{{- if .Values.alertWebhooks.enabled }}
{{ include "chmonitor.alertWebhooks.validate" . }}
{{- end }}
data:
  CLICKHOUSE_HOST: {{ .Values.clickhouse.host | quote }}
  CLICKHOUSE_USER: {{ .Values.clickhouse.user | quote }}
  CLICKHOUSE_MAX_EXECUTION_TIME: {{ .Values.clickhouse.maxExecutionTime | quote }}
  {{- with .Values.queryAttribution }}
  CHM_QUERY_ATTRIBUTION: {{ .enabled | toString | quote }}
  CHM_QUERY_ATTRIBUTION_SQL_COMMENT: {{ .sqlComment | toString | quote }}
  CHM_QUERY_ATTRIBUTION_INCLUDE_EMAIL: {{ .includeEmail | toString | quote }}
  {{- if .label }}
  CHM_QUERY_ATTRIBUTION_LABEL: {{ .label | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $val := .Values.features }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.clerk.publishableKey }}
  CHM_CLERK_PUBLISHABLE_KEY: {{ .Values.auth.clerk.publishableKey | quote }}
  {{- end }}
  {{- if .Values.alertWebhooks.enabled }}
  HEALTH_ALERT_WEBHOOK_TARGETS: {{ include "chmonitor.alertWebhooks.targetsJson" . | quote }}
  {{- end }}
  {{- with .Values.alerting }}
  {{- if .instanceName }}
  HEALTH_ALERT_INSTANCE_NAME: {{ .instanceName | quote }}
  {{- end }}
  {{- if .dashboardUrl }}
  HEALTH_ALERT_DASHBOARD_URL: {{ .dashboardUrl | quote }}
  {{- end }}
  {{- if .metadata }}
  HEALTH_ALERT_METADATA: {{ .metadata | toJson | quote }}
  {{- end }}
  {{- end }}
