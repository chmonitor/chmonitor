services:
  clickhouse:
    image: ghcr.io/duyet/docker-images:clickhouse_25.8
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/?query=SELECT%201"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_REF: local
        GITHUB_SHA: local-build
        VITE_DEPLOY_TARGET: docker
    ports:
      - "3000:3000"
    # Optional Docker override only (`required: false`). Copy
    # apps/dashboard/.env.example → repo-root `.env`. The `environment:`
    # block below wins for the bundled ClickHouse service.
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      PORT: 3000
      HOST: "0.0.0.0"
    # Optional: self-hosted local config override (queries.d). Mount a host
    # directory of custom *.yaml query configs and point CHM_CONFIG_DIRECTORY
    # (set it in `.env`) at the container path below. Invalid files are
    # skipped + logged; leave both lines commented out to keep the default
    # (no local overrides, TS/declarative catalog only).
    # volumes:
    #   - ./queries.d:/etc/chmonitor/queries.d:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    # /healthz = liveness (static 200 while the process is up).
    # /api/healthz = readiness (200 only when every configured ClickHouse
    # host answers; 503 otherwise). The container healthcheck must use the
    # liveness endpoint so an unreachable ClickHouse doesn't mark the app
    # container unhealthy. See docs/knowledge/k8s-health-probes.md.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
