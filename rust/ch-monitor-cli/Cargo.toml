[package]
name = "chmonitor"
version = "0.1.4"
edition = "2021"
authors = ["duyet <bot@duyet.net>"]
description = "Standalone terminal/TUI CLI for chmonitor (`chm` / `chmonitor`). Run `chm` for the live TUI."
license = "MIT"
repository = "https://github.com/chmonitor/chmonitor"
readme = "README.md"
keywords = ["cli", "tui", "diagnostics", "monitoring", "database"]
categories = ["command-line-utilities"]
exclude = ["/.github"]

# Marketed commands are `chm` and `chmonitor`. Without explicit [[bin]]
# names, `cargo install chmonitor` would drop a binary named after the
# package only.
[[bin]]
name = "chm"
path = "src/main.rs"

[[bin]]
name = "chmonitor"
path = "src/main.rs"

[features]
default = []
mermaid = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.0"
dirs = "6"
ratatui = "0.30"
crossterm = "0.28"
indicatif = "0.17"
owo-colors = "4"
open = "5"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
futures-util = "0.3"
eventsource-stream = "0.2"
bytes = "1"
