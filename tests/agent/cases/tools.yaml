# Dedicated primitives — assert a tool was called. Tag `tools`.
- description: 'Tools — list tables in system'
  tags: [tools]
  metadata:
    covers: [list_tables]
  vars:
    prompt: 'List tables in the system database'
  assert:
    - type: contains
      value: '[tool:'

- description: 'Tools — schema of system.query_log'
  tags: [tools]
  metadata:
    covers: [get_table_schema, explore_table_schema]
  vars:
    prompt: 'Show me the schema of system.query_log'
  assert:
    - type: contains
      value: '[tool:'
    - type: llm-rubric
      value: >-
        The answer mentions columns consistent with system.query_log
        (for example event_time, query, query_duration_ms, type) from a
        schema tool, not invented column names.

- description: 'Tools — running queries'
  tags: [tools]
  metadata:
    covers: [get_running_queries]
  vars:
    prompt: 'How many queries are currently running?'
  assert:
    - type: contains
      value: '[tool:'

- description: 'Tools — failed queries'
  tags: [tools]
  metadata:
    covers: [get_failed_queries]
  vars:
    prompt: 'What queries failed in the last day?'
  assert:
    - type: contains
      value: '[tool:'

- description: 'Tools — replication status'
  tags: [tools]
  metadata:
    covers: [get_replication_status]
  vars:
    prompt: 'Is replication lagging on this host?'
  assert:
    - type: contains
      value: '[tool:'

- description: 'Tools — merge status'
  tags: [tools]
  metadata:
    covers: [get_merge_status]
  vars:
    prompt: 'Are there any stuck or long-running merges?'
  assert:
    - type: contains
      value: '[tool:'

- description: 'Tools — EXPLAIN a simple query'
  tags: [tools]
  metadata:
    covers: [explain_query, query]
  vars:
    prompt: 'This query is slow: SELECT * FROM system.query_log LIMIT 10. Why?'
  assert:
    - type: contains
      value: '[tool:'
    - type: llm-rubric
      value: >-
        The answer uses schema and/or EXPLAIN tools and discusses cost
        (SELECT *, no PREWHERE, reading query_log). It does not claim to
        have rewritten the table.

- description: 'Tools — load_skill for schema design'
  tags: [tools]
  metadata:
    covers: [load_skill]
  vars:
    prompt: 'What ORDER BY key should I use for a typical events table?'
  assert:
    - type: llm-rubric
      value: >-
        The answer discusses ORDER BY / primary key design for ClickHouse
        (low-cardinality time or tenant first, then filter columns).
        Loading a skill is good. It must not invent a specific table's
        current ORDER BY unless a tool returned it.

- description: 'Tools — PeerDB metrics'
  tags: [tools]
  metadata:
    covers: [get_peerdb_metrics]
  vars:
    prompt: >-
      Our ClickHouse CDC replication is behind. Check the PeerDB fleet and tell
      me which replication slot is lagging worst and whether the lag is growing.
  assert:
    - type: contains
      value: '[tool:'
    - type: llm-rubric
      value: >-
        The answer uses a PeerDB metrics tool and discusses replication-slot
        lag, naming either a specific slot/peer or stating that no PeerDB data
        was available. It must not invent slot names or lag figures, and must
        not claim to have changed anything.
