# Question bank: realistic user questions mapped to the tool(s) and skill
# the agent should reach for. `metadata.covers` is the expected primary tool(s);
# `metadata.skills` the skill `load_skill` should load. `toolCalled` accepts the
# covers plus listed fallbacks. Structural gate: tests/agent/question-bank.test.ts.
# The live SSE parser emits `[tool:load_skill]` without the skill name, so the
# skill mapping is checked structurally only. Tag `tools` (runs in test:agent:all).
- description: 'Question — discover tools'
  tags: [tools]
  metadata:
    covers: [search_tools]
  vars:
    prompt: 'What can you actually do for me on this cluster? List your capabilities.'
  assert:
    - type: javascript
      value: file://./assertions.js:toolCalled
      config:
        tools: [search_tools]

- description: 'Question — which tool for skip indexes'
  tags: [tools]
  metadata:
    covers: [search_tools]
  vars:
    prompt: 'Is there a tool that can recommend a skip index for a slow table?'
  assert:
    - type: javascript
      value: file://./assertions.js:toolCalled
      config:
        tools: [search_tools, get_optimization_recommendations]

