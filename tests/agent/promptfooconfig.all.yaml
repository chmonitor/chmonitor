# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Live agent eval. Hits POST /api/v1/agent (local or public) with a real
# AnyRouter key on the *server* under test, and grades answers with AnyRouter
# via promptfoo llm-rubric.
#
#   export ANYROUTER_API_KEY=...          # rubric + (local) agent
#   export AGENT_API_TOKEN=...            # bearer for /api/v1/agent
#   export AGENT_EVAL_URL=http://localhost:3000/api/v1/agent
#   pnpm run test:agent                   # core + safety
#   pnpm run test:agent:all               # + tools/quality/extended
#
# CI (.github/workflows/agent-eval.yml) runs this on PRs that touch agent
# prompts/skills, against dash.chmonitor.dev when secrets are present.

description: 'chmonitor agent live eval (AnyRouter)'

prompts:
  - '{{prompt}}'

providers:
  - id: '${AGENT_EVAL_URL}'
    label: agent-http
    config:
      method: POST
      headers:
        Content-Type: application/json
        Authorization: 'Bearer ${AGENT_API_TOKEN}'
      body:
        message: '{{prompt}}'
        messages:
          - role: user
            parts:
              - type: text
                text: '{{prompt}}'
        hostId: 0
        model: '{{model}}'
      transformResponse: file://./parse-agent-sse.js

defaultTest:
  vars:
    model: '${AGENT_EVAL_MODEL}'
  options:
    provider:
      id: openai:chat:${AGENT_EVAL_GRADER_MODEL}
      config:
        apiBaseUrl: '${ANYROUTER_API_BASE}'
        apiKeyEnvar: ANYROUTER_API_KEY
        headers:
          X-AnyRouter-Source: chmonitor
          X-AnyRouter-Title: chmonitor-agent-eval
          X-AnyRouter-Categories: programming-app
  assert:
    - type: not-contains
      value: '[error:'
    - type: latency
      threshold: 90000

tests:
  - file://./cases/core.yaml
  - file://./cases/safety.yaml
  - file://./cases/tools.yaml
  - file://./cases/quality.yaml
  - file://./cases/extended.yaml
  - file://./cases/coverage.yaml

evaluateOptions:
  maxConcurrency: 1
  cache: false
